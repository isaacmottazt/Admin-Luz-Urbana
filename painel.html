<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Painel de Agendamentos
</title>

<link
rel="stylesheet"
href="painel.css">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- === PWA CONFIGURAÇÃO (ADICIONAR EM TODAS AS PÁGINAS) === -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d6a04c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Luz Urbana">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">

<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
            .then(registration => {
                console.log('✅ PWA registrado com sucesso!');

                registration.addEventListener('updatefound', () => {
                    const newWorker = registration.installing;
                    newWorker.addEventListener('statechange', () => {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                            mostrarNotificacaoAtualizacao();
                        }
                    });
                });
            })
            .catch(error => {
                console.log('❌ Erro ao registrar PWA:', error);
            });
    });
}

function mostrarNotificacaoAtualizacao() {
    const notificacao = document.createElement('div');
    notificacao.innerHTML = `
        <div style="
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #d6a04c;
            color: #000;
            padding: 15px 20px;
            border-radius: 10px;
            z-index: 9999;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            cursor: pointer;
            animation: slideIn 0.3s ease;
        ">
            🔄 Nova versão disponível! Clique para atualizar.
        </div>
        <style>
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
        </style>
    `;
    notificacao.onclick = () => window.location.reload();
    document.body.appendChild(notificacao);
    setTimeout(() => notificacao.remove(), 5000);
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    mostrarBotaoInstalar();
});

function mostrarBotaoInstalar() {
    const btnInstalar = document.createElement('button');
    btnInstalar.innerHTML = '📱 Instalar App';
    btnInstalar.style.cssText = `
        position: fixed;
        bottom: 20px;
        left: 20px;
        background: #d6a04c;
        color: #000;
        padding: 12px 20px;
        border-radius: 50px;
        border: none;
        font-family: 'Poppins', sans-serif;
        font-weight: 600;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        animation: slideIn 0.3s ease;
    `;

    btnInstalar.onclick = async () => {
        if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            console.log(`Usuário ${outcome === 'accepted' ? 'instalou' : 'cancelou'} o app`);
            deferredPrompt = null;
            btnInstalar.remove();
        }
    };

    document.body.appendChild(btnInstalar);

    setTimeout(() => {
        if (btnInstalar.parentNode) btnInstalar.remove();
    }, 10000);
}
</script>
<!-- === FIM PWA === -->

</head>

<body>

<div class="app-shell">

<!-- FAIXA LATERAL -->
<aside class="faixa">
    <div class="faixa-logo"><img src="img/logo.png" alt="Logo"></div>
    <div class="faixa-linha"></div>
    <button class="faixa-btn" onclick="verTodosAgendamentos()" title="Todos os agendamentos">📅</button>
    <button class="faixa-btn" onclick="verAgendamentosAceitos()" title="Aceitos">✅</button>
    <a class="faixa-btn" href="index.html" title="Galeria">🖼️</a>
    <div class="faixa-espaco"></div>
    <button class="faixa-btn faixa-btn--sair" onclick="logout()" title="Sair">⎋</button>
</aside>

<div class="conteudo">

<!-- CABEÇALHO -->
<header class="cabecalho">
    <div class="cabecalho-titulo">
        <h1>Agendamentos</h1>
        <p>Acompanhamento em tempo real &middot; Luz Urbana</p>
    </div>

    <div class="cabecalho-stats">
        <div class="mini-stat" onclick="verTodosAgendamentos()">
            <span class="mini-stat-numero" id="totalAgendamentos">0</span>
            <span class="mini-stat-label">Total</span>
        </div>
        <div class="mini-stat mini-stat--azul" onclick="verAgendamentosAceitos()">
            <span class="mini-stat-numero" id="totalAceitos">0</span>
            <span class="mini-stat-label">Aceitos</span>
        </div>
        <div class="mini-stat mini-stat--roxo">
            <span class="mini-stat-numero" id="totalClientes">0</span>
            <span class="mini-stat-label">Clientes</span>
        </div>
    </div>
</header>

<!-- CALENDÁRIO -->
<section class="painel-vidro calendario-box">
    <div class="painel-vidro-topo">
        <h2 id="calendarioMesAno">Calendário</h2>
        <div class="calendario-nav">
            <button class="calendario-nav-btn" onclick="calendarioMesAnterior()" title="Mês anterior">‹</button>
            <button class="calendario-nav-btn" onclick="calendarioMesAtual()" title="Hoje">•</button>
            <button class="calendario-nav-btn" onclick="calendarioMesSeguinte()" title="Próximo mês">›</button>
        </div>
    </div>

    <div class="calendario-semana">
        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
    </div>

    <div id="calendarioGrid" class="calendario-grid"></div>

    <div id="calendarioDiaSelecionado" class="calendario-dia-selecionado"></div>

    <div class="calendario-rodape">
        <button class="btn-ver-mais" onclick="verTodosPorData()">Ver mais &middot; todos organizados por data</button>
    </div>
</section>

<!-- GRID PRINCIPAL -->
<div class="grid-principal">

    <!-- COLUNA ESQUERDA: GRÁFICO MENSAL -->
    <section class="painel-vidro coluna-grafico">
        <div class="painel-vidro-topo">
            <h2>Agendamentos por mês</h2>
            <span id="graficoVariacao" class="tag-variacao">—</span>
        </div>
        <div class="grafico-area">
            <canvas id="graficoMensalCanvas"></canvas>
        </div>
        <div id="graficoLegenda" class="grafico-legenda"></div>
    </section>

    <!-- COLUNA DIREITA: STATUS -->
    <section class="coluna-status">

        <div class="painel-vidro status-box">
            <div class="status-topo pendente-topo" onclick="toggleLista('pendentes-lista')">
                <div class="status-topo-esq">
                    <span class="status-ponto status-ponto--laranja"></span>
                    <h2>Pendentes</h2>
                </div>
                <span id="totalPendentes">0</span>
            </div>
            <div id="pendentes-lista" class="lista-agendamentos"></div>
        </div>

        <div class="painel-vidro status-box">
            <div class="status-topo andamento-topo" onclick="toggleLista('andamento-lista')">
                <div class="status-topo-esq">
                    <span class="status-ponto status-ponto--azul"></span>
                    <h2>Em andamento</h2>
                </div>
                <span id="totalAndamento">0</span>
            </div>
            <div id="andamento-lista" class="lista-agendamentos"></div>
        </div>

        <div class="painel-vidro status-box">
            <div class="status-topo finalizado-topo" onclick="toggleLista('finalizados-lista')">
                <div class="status-topo-esq">
                    <span class="status-ponto status-ponto--verde"></span>
                    <h2>Ensaios Finalizados</h2>
                </div>
                <span id="totalFinalizados">0</span>
            </div>
            <div id="finalizados-lista" class="lista-agendamentos"></div>
        </div>

    </section>

</div>

</div><!-- /.conteudo -->

</div><!-- /.app-shell -->

<!-- LISTA MODAL PARA EXIBIR AGENDAMENTOS -->

<div id="modalLista" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitulo">Agendamentos</h3>
            <span class="modal-fechar" onclick="fecharModal()">&times;</span>
        </div>
        <div id="modalListaConteudo" class="modal-lista">
            <!-- Conteúdo dinâmico -->
        </div>
    </div>
</div>

<!-- MODAL DE CONFIRMAÇÃO DE EXCLUSÃO -->
<div id="modalExcluirAgendamento" class="modal">
    <div class="modal-content modal-excluir-conteudo">
        <div class="modal-excluir-icone">!</div>
        <h3>Excluir este agendamento?</h3>
        <p>Essa ação não pode ser desfeita.</p>
        <div class="modal-excluir-botoes">
            <button class="btn-cancelar" onclick="fecharModalExcluirAgendamento()">Cancelar</button>
            <button class="btn-confirmar-excluir" onclick="confirmarExclusaoAgendamento()">Excluir</button>
        </div>
    </div>
</div>

<script src="painel.js"></script>

</body>
</html>
