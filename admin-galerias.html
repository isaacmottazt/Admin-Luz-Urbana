<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Galerias — Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: #d6a04c;
        }

        .btn-voltar {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
        }

        .btn-voltar:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Abas */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .tab-btn.ativo {
            color: #d6a04c;
            border-bottom-color: #d6a04c;
        }

        .tab-btn:hover {
            color: #fff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.ativo {
            display: block;
        }

        /* ===== ABA 1: LISTAR GALERIAS ===== */
        .galerias-list {
            display: grid;
            gap: 20px;
        }

        .galeria-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .galeria-item:hover {
            border-color: #d6a04c;
            background: rgba(255, 255, 255, 0.08);
        }

        .galeria-header-item {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .galeria-id {
            font-family: monospace;
            font-size: 13px;
            color: #d6a04c;
            background: rgba(214, 160, 76, 0.1);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .galeria-status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .galeria-status.ativa {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
        }

        .galeria-status.expirada {
            background: rgba(230, 126, 34, 0.2);
            color: #e67e22;
        }

        .galeria-status.bloqueada {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
        }

        .galeria-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
            font-size: 13px;
        }

        .info-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 6px;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .info-value {
            color: #fff;
            font-weight: 500;
        }

        .galeria-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-acao {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .btn-acao:hover {
            background: #d6a04c;
            border-color: #d6a04c;
            color: #1a1a1a;
        }

        /* ===== ABA 2: CRIAR GALERIA ===== */
        .form-criar {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 6px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #d6a04c;
            background: rgba(0, 0, 0, 0.3);
        }

        .btn-criar {
            width: 100%;
            padding: 12px;
            background: #d6a04c;
            color: #1a1a1a;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-criar:hover {
            background: #e8b85c;
        }

        .btn-criar:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ===== ABA 3: UPLOAD DE FOTOS ===== */
        .upload-area {
            border: 2px dashed rgba(214, 160, 76, 0.5);
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(214, 160, 76, 0.05);
        }

        .upload-area:hover {
            border-color: #d6a04c;
            background: rgba(214, 160, 76, 0.1);
        }

        .upload-area.arrastando {
            border-color: #d6a04c;
            background: rgba(214, 160, 76, 0.15);
        }

        .upload-area p {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .upload-area small {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        #inputArquivos {
            display: none;
        }

        .fotos-selecionadas {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 10px;
        }

        .preview-foto {
            position: relative;
            aspect-ratio: 1;
            border-radius: 6px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .preview-foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-status {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px;
            font-size: 10px;
            text-align: center;
        }

        .preview-status.enviando {
            background: rgba(52, 152, 219, 0.7);
        }

        .preview-status.pronto {
            background: rgba(46, 204, 113, 0.7);
        }

        .preview-status.erro {
            background: rgba(231, 76, 60, 0.7);
        }

        .msg-sucesso,
        .msg-erro {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .msg-sucesso {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border-left: 3px solid #2ecc71;
        }

        .msg-erro {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border-left: 3px solid #e74c3c;
        }

        .msg-sucesso.mostrar,
        .msg-erro.mostrar {
            display: block;
        }

        .vazio {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📸 Gerenciar Galerias</h1>
            <a href="painel.html" class="btn-voltar">← Voltar</a>
        </div>

        <div class="tabs">
            <button class="tab-btn ativo" onclick="abarajarTab('listar')">📋 Listar Galerias</button>
            <button class="tab-btn" onclick="abarajarTab('criar')">➕ Criar Nova</button>
            <button class="tab-btn" onclick="abarajarTab('upload')">📤 Upload de Fotos</button>
        </div>

        <!-- ABA 1: LISTAR -->
        <div id="tabListar" class="tab-content ativo">
            <div id="listaGalerias" class="galerias-list"></div>
            <div id="listaVazia" class="vazio" style="display:none;">
                <p>Nenhuma galeria criada ainda</p>
            </div>
        </div>

        <!-- ABA 2: CRIAR -->
        <div id="tabCriar" class="tab-content">
            <div class="form-criar">
                <h2 style="margin-bottom: 20px; color: #d6a04c;">Criar Nova Galeria</h2>

                <div class="form-group">
                    <label>ID do Agendamento *</label>
                    <input type="text" id="criarAgendamentoId" placeholder="Copiar da tabela de agendamentos">
                </div>

                <div class="form-group">
                    <label>Nome do Cliente *</label>
                    <input type="text" id="criarClienteNome" placeholder="João Silva">
                </div>

                <div class="form-group">
                    <label>Email do Cliente *</label>
                    <input type="email" id="criarClienteEmail" placeholder="joao@email.com">
                </div>

                <button class="btn-criar" onclick="criarNovaGaleria()">Criar e Gerar Senha</button>

                <div id="msgCriar" class="msg-sucesso"></div>
            </div>
        </div>

        <!-- ABA 3: UPLOAD -->
        <div id="tabUpload" class="tab-content">
            <div style="margin-bottom: 20px;">
                <label style="color: rgba(255,255,255,0.8); margin-bottom: 10px; display:block;">ID da Galeria *</label>
                <input type="text" id="uploadGaleriaId" placeholder="abc123xyz" style="
                    width: 100%;
                    padding: 10px;
                    background: rgba(0, 0, 0, 0.2);
                    border: 1px solid rgba(255, 255, 255, 0.2);
                    color: #fff;
                    border-radius: 6px;
                    font-family: inherit;
                    margin-bottom: 20px;
                ">
            </div>

            <div class="upload-area" id="uploadArea" onclick="document.getElementById('inputArquivos').click()">
                <p>📸 Clique ou arraste fotos aqui</p>
                <small>Formatos: JPG, PNG, WebP • Máx 10MB cada</small>
            </div>

            <input type="file" id="inputArquivos" multiple accept="image/*" onchange="selecionarFotos(event)">

            <div id="msgUpload" class="msg-sucesso"></div>

            <div id="fotosPreview" class="fotos-selecionadas"></div>

            <div style="margin-top: 20px; text-align: center;">
                <button class="btn-criar" id="btnEnviarFotos" onclick="enviarFotos()" disabled>
                    Enviar Fotos
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="galerias-sistema-completo.js"></script>
    <script>
        // Client próprio desta página para consultas diretas (listar/deletar).
        // O módulo GaleriaPrivada não expõe o client, então criamos um aqui
        // com as mesmas credenciais usadas em todo o projeto.
        const adminSupabaseClient = supabase.createClient(
            "https://tbwmsgztpyyratambgqs.supabase.co",
            "sb_publishable_yqH30kXsSD7nmwdlgPj93Q_pw1QrcQd"
        );

        let fotosParaEnviar = [];

        // ===== ABAS =====
        function abarajarTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('ativo'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('ativo'));
            
            event.target.classList.add('ativo');
            document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('ativo');

            if (tab === 'listar') {
                carregarGalerias();
            }
        }

        // ===== ABA 1: LISTAR GALERIAS =====
        async function carregarGalerias() {
            try {
                const { data: galerias, error } = await adminSupabaseClient
                    .from('galerias')
                    .select('*')
                    .order('data_criacao', { ascending: false });

                if (error) throw error;

                const container = document.getElementById('listaGalerias');
                const vazio = document.getElementById('listaVazia');

                if (!galerias || galerias.length === 0) {
                    container.innerHTML = '';
                    vazio.style.display = 'block';
                    return;
                }

                vazio.style.display = 'none';

                container.innerHTML = galerias.map(gal => {
                    const expiracao = new Date(gal.data_expiracao);
                    const dias = Math.ceil((expiracao - new Date()) / (1000 * 60 * 60 * 24));

                    return `
                        <div class="galeria-item">
                            <div class="galeria-header-item">
                                <div>
                                    <div class="galeria-id">${gal.id.substring(0, 8)}...</div>
                                </div>
                                <span class="galeria-status ${gal.status}">${gal.status.toUpperCase()}</span>
                            </div>

                            <div class="galeria-info">
                                <div class="info-item">
                                    <div class="info-label">Fotos</div>
                                    <div class="info-value">${gal.total_fotos}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Criada em</div>
                                    <div class="info-value">${new Date(gal.data_criacao).toLocaleDateString('pt-BR')}</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Validade</div>
                                    <div class="info-value">${dias} dias</div>
                                </div>
                                <div class="info-item">
                                    <div class="info-label">Senha</div>
                                    <div class="info-value" style="font-family:monospace;">${gal.senha}</div>
                                </div>
                            </div>

                            <div class="galeria-actions">
                                <button class="btn-acao" onclick="copiarIdGaleria('${gal.id}')">📋 Copiar ID</button>
                                <button class="btn-acao" onclick="copiarSenha('${gal.senha}')">🔐 Copiar Senha</button>
                                <button class="btn-acao" onclick="abrirLink('${gal.id}')">🔗 Ver Link</button>
                                <button class="btn-acao" onclick="deletarGaleria('${gal.id}')">🗑️ Deletar</button>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (erro) {
                console.error('Erro ao carregar galerias:', erro);
            }
        }

        function copiarIdGaleria(id) {
            navigator.clipboard.writeText(id);
            alert('ID copiado!');
        }

        function copiarSenha(senha) {
            navigator.clipboard.writeText(senha);
            alert('Senha copiada!');
        }

        function abrirLink(id) {
            const link = `${window.location.origin}/galeria-privada-novo.html?id=${id}`;
            window.open(link, '_blank');
        }

        async function deletarGaleria(id) {
            if (!confirm('Deletar galeria e todas as suas fotos?')) return;

            try {
                const { error } = await adminSupabaseClient
                    .from('galerias')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                alert('Galeria deletada!');
                carregarGalerias();
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Erro ao deletar');
            }
        }

        // ===== ABA 2: CRIAR GALERIA =====
        async function criarNovaGaleria() {
            const agId = document.getElementById('criarAgendamentoId').value.trim();
            const nome = document.getElementById('criarClienteNome').value.trim();
            const email = document.getElementById('criarClienteEmail').value.trim();
            const msg = document.getElementById('msgCriar');

            if (!agId || !nome || !email) {
                alert('Preencha todos os campos');
                return;
            }

            try {
                const resultado = await GaleriaPrivada.criarGaleriaParaAgendamento(agId, nome, email);

                msg.textContent = `✅ Galeria criada! ID: ${resultado.galeria_id} | Senha: ${resultado.senha}`;
                msg.classList.add('mostrar');

                // Limpar form
                document.getElementById('criarAgendamentoId').value = '';
                document.getElementById('criarClienteNome').value = '';
                document.getElementById('criarClienteEmail').value = '';

                setTimeout(() => msg.classList.remove('mostrar'), 5000);

            } catch (erro) {
                console.error('Erro:', erro);
                msg.textContent = '❌ Erro ao criar galeria';
                msg.classList.add('mostrar');
            }
        }

        // ===== ABA 3: UPLOAD =====
        const uploadArea = document.getElementById('uploadArea');

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('arrastando');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('arrastando');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('arrastando');
            const files = e.dataTransfer.files;
            document.getElementById('inputArquivos').files = files;
            selecionarFotos({ target: { files } });
        });

        function selecionarFotos(event) {
            fotosParaEnviar = Array.from(event.target.files);

            const preview = document.getElementById('fotosPreview');
            preview.innerHTML = fotosParaEnviar.map((foto, idx) => `
                <div class="preview-foto">
                    <img src="${URL.createObjectURL(foto)}" alt="">
                    <div class="preview-status">📦 Pronto</div>
                </div>
            `).join('');

            document.getElementById('btnEnviarFotos').disabled = fotosParaEnviar.length === 0;
        }

        async function enviarFotos() {
            const galeriaId = document.getElementById('uploadGaleriaId').value.trim();
            const msg = document.getElementById('msgUpload');

            if (!galeriaId) {
                alert('Digite o ID da galeria');
                return;
            }

            if (fotosParaEnviar.length === 0) {
                alert('Selecione fotos para enviar');
                return;
            }

            const btn = document.getElementById('btnEnviarFotos');
            btn.disabled = true;
            btn.textContent = `Enviando ${fotosParaEnviar.length} foto(s)...`;

            let enviadas = 0;
            let erros = 0;

            for (const [idx, foto] of fotosParaEnviar.entries()) {
                try {
                    const previews = document.querySelectorAll('.preview-foto');
                    previews[idx].querySelector('.preview-status').classList.add('enviando');
                    previews[idx].querySelector('.preview-status').textContent = '⏳ Enviando...';

                    await GaleriaPrivada.uploadFoto(galeriaId, foto, true);

                    previews[idx].querySelector('.preview-status').classList.remove('enviando');
                    previews[idx].querySelector('.preview-status').classList.add('pronto');
                    previews[idx].querySelector('.preview-status').textContent = '✅ Pronto!';
                    enviadas++;

                } catch (erro) {
                    console.error('Erro no upload:', erro);
                    const previews = document.querySelectorAll('.preview-foto');
                    previews[idx].querySelector('.preview-status').classList.add('erro');
                    previews[idx].querySelector('.preview-status').textContent = '❌ Erro';
                    erros++;
                }
            }

            msg.textContent = `✅ ${enviadas} fotos enviadas com sucesso!${erros > 0 ? ` ❌ ${erros} erros.` : ''}`;
            msg.classList.add('mostrar');

            btn.disabled = false;
            btn.textContent = 'Enviar Fotos';

            setTimeout(() => msg.classList.remove('mostrar'), 5000);
        }

        // Carregar ao abrir
        window.addEventListener('load', carregarGalerias);
    </script>

</body>
</html>
